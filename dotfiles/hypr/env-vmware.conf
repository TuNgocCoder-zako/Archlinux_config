# VMware / Virtual Machine Environment Variables
# Applied automatically when running in VMware or Virtual Machine

# Hardware cursor fix for virtual displays
env = WLR_NO_HARDWARE_CURSORS,1
env = WLR_RENDERER_ALLOW_SOFTWARE,1

# ── Software Rendering Fallback (Uncomment ONLY if 3D Acceleration is disabled in VMware) ──
# env = LIBGL_ALWAYS_SOFTWARE,1
# env = XWAYLAND_NO_GLAMOR,1
