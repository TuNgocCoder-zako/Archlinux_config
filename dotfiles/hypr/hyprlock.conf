# Caelestia / Hyprland Lockscreen Configuration (hyprlock)

$font = JetBrainsMono Nerd Font

general {
    disable_loading_bar = true
    hide_cursor = false
    grace = 0
    no_fade_in = false
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.015
    contrast = 0.9
    brightness = 0.75
    vibrancy = 0.15
}

# TIME (Large Clock)
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(255, 255, 255, 0.95)
    font_size = 90
    font_family = $font ExtraBold
    position = 0, 160
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(255, 255, 255, 0.75)
    font_size = 20
    font_family = $font Medium
    position = 0, 80
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 3
}

# USERNAME
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.85)
    font_size = 18
    font_family = $font SemiBold
    position = 0, -40
    halign = center
    valign = center
}

# PASSWORD INPUT FIELD
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(39, 102, 125, 0.8) rgba(162, 221, 248, 0.8) 45deg
    inner_color = rgba(20, 20, 25, 0.6)
    font_color = rgb(240, 240, 240)
    fade_on_empty = false
    rounding = 24
    check_color = rgba(100, 200, 100, 0.8)
    fail_color = rgba(220, 50, 50, 0.8)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_transition = 200
    placeholder_text = <span>Nhập mật khẩu...</span>
    hide_input = false
    position = 0, -100
    halign = center
    valign = center
}
