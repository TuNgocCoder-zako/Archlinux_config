# Hyprlock — Anime Lock Screen (Catppuccin Mocha)

background {
    monitor =
    path = ~/Pictures/Wallpapers/emilia_dark.png
    color = rgba(30, 30, 46, 1.0)
    blur_passes = 3
    blur_size = 6
}

label {
    monitor =
    text = おかえりなさい ✿
    color = rgb(f5c2e7)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
    shadow_passes = 1
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(cdd6f4)
    font_size = 72
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 260
    halign = center
    valign = center
    shadow_passes = 2
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgb(bac2de)
    font_size = 16
    font_family = JetBrainsMono Nerd Font
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 1
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(cba6f7)
    inner_color = rgb(1e1e2e)
    font_color = rgb(cdd6f4)
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Password...</i>
    hide_input = false
    rounding = 12
    check_color = rgb(a6e3a1)
    fail_color = rgb(f38ba8)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_transition = 300
    capslock_color = rgb(f9e2af)
    position = 0, -60
    halign = center
    valign = center
}
