# Developer / Coding Mode:
# Hyprland runs on Intel Iris Xe iGPU (ultra-smooth 144Hz, zero fan noise, cool laptop, long battery).
# NVIDIA RTX 3050 enters D3cold deep sleep (0W), waking up only for CUDA/ML compute via prime-run.

# Display scanout & renderer directly on Intel iGPU
env = AQ_DRM_DEVICES,/dev/dri/card-intel:/dev/dri/card-nvidia

# Hardware video acceleration via Intel iHD (TigerLake)
env = LIBVA_DRIVER_NAME,iHD
env = MESA_LOADER_DRIVER_OVERRIDE,iris

# Force Firefox & video decoding on Intel iGPU (prevents waking NVIDIA dGPU, saving 6W on battery)
env = MOZ_DRM_DEVICE,/dev/dri/renderD128
env = MOZ_ENABLE_WAYLAND,1
