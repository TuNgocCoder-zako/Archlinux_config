# ╔══════════════════════════════════════════╗
# ║     Hyprland Config — Anime Rice         ║
# ║     Catppuccin Mocha + VMware            ║
# ╚══════════════════════════════════════════╝

# === Source external configs ===
source = ~/.config/hypr/env.conf

# ┌──────────────────────────────────────────┐
# │         Catppuccin Mocha Colors          │
# └──────────────────────────────────────────┘
$rosewater = rgb(f5e0dc)
$flamingo  = rgb(f2cdcd)
$pink      = rgb(f5c2e7)
$mauve     = rgb(cba6f7)
$red       = rgb(f38ba8)
$maroon    = rgb(eba0ac)
$peach     = rgb(fab387)
$yellow    = rgb(f9e2af)
$green     = rgb(a6e3a1)
$teal      = rgb(94e2d5)
$sky       = rgb(89dceb)
$sapphire  = rgb(74c7ec)
$blue      = rgb(89b4fa)
$lavender  = rgb(b4befe)
$text      = rgb(cdd6f4)
$subtext1  = rgb(bac2de)
$subtext0  = rgb(a6adc8)
$overlay2  = rgb(9399b2)
$overlay1  = rgb(7f849c)
$overlay0  = rgb(6c7086)
$surface2  = rgb(585b70)
$surface1  = rgb(45475a)
$surface0  = rgb(313244)
$base      = rgb(1e1e2e)
$mantle    = rgb(181825)
$crust     = rgb(11111b)

# ┌──────────────────────────────────────────┐
# │              Variables                   │
# └──────────────────────────────────────────┘
$terminal = foot
$fileManager = thunar
$menu = rofi -show drun -theme ~/.config/rofi/anime.rasi

# ┌──────────────────────────────────────────┐
# │               Monitor                   │
# └──────────────────────────────────────────┘
# VMware auto-detects resolution
monitor = ,preferred,auto,1

# ┌──────────────────────────────────────────┐
# │              Autostart                   │
# └──────────────────────────────────────────┘
exec-once = systemctl --user start pipewire wireplumber
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = swaync
exec-once = swww-daemon
exec-once = sleep 2 && swww img ~/Pictures/Wallpapers/anime-wall.jpg --transition-type fade --transition-fps 30 --transition-duration 1 2>/dev/null
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# ┌──────────────────────────────────────────┐
# │               General                   │
# └──────────────────────────────────────────┘
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Gradient border: mauve → pink (anime feel)
    col.active_border = $mauve $pink 45deg
    col.inactive_border = $surface0

    layout = dwindle
    allow_tearing = false
}

# ┌──────────────────────────────────────────┐
# │             Decoration                   │
# └──────────────────────────────────────────┘
# NOTE: Blur disabled for VMware performance
decoration {
    rounding = 12

    blur {
        enabled = false
        # Uncomment below if running on bare metal:
        # enabled = true
        # size = 6
        # passes = 3
        # new_optimizations = true
        # xray = true
    }

    shadow {
        enabled = true
        range = 10
        render_power = 3
        color = rgba(1a1a2ecc)
    }

    # Slight transparency for that anime aesthetic
    active_opacity = 0.95
    inactive_opacity = 0.85
}

# ┌──────────────────────────────────────────┐
# │             Animations                   │
# └──────────────────────────────────────────┘
# Lightweight animations for VMware
animations {
    enabled = true

    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = anime, 0.23, 1, 0.32, 1

    animation = windows, 1, 4, anime, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, anime, slide
    animation = border, 1, 8, default
    animation = borderangle, 1, 30, smoothIn, loop
    animation = fade, 1, 4, smoothIn
    animation = workspaces, 1, 4, anime, slidevert
}

# ┌──────────────────────────────────────────┐
# │              Layouts                     │
# └──────────────────────────────────────────┘
dwindle {
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

# ┌──────────────────────────────────────────┐
# │               Input                      │
# └──────────────────────────────────────────┘
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

# ┌──────────────────────────────────────────┐
# │                Misc                      │
# └──────────────────────────────────────────┘
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# === Keybinds (sourced at the end after variables) ===
source = ~/.config/hypr/keybinds.conf

