# Hypridle — Auto-lock, screen off, and sleep configuration
# Tối ưu hóa: Tuyệt đối KHÔNG tự động khóa màn hình hoặc suspend khi đang cắm sạc (AC)

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })"
}

# 1. Sau 2 phút (120s): Giảm độ sáng màn hình xuống 25% (CHỈ KHI DÙNG PIN)
listener {
    timeout = 120
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ACAD/online 2>/dev/null)" != "1" ] && { touch /run/user/1000/hypridle_dimmed; brightnessctl -s set 25; }'
    on-resume = sh -c 'if [ -f /run/user/1000/hypridle_dimmed ]; then rm -f /run/user/1000/hypridle_dimmed; [ "$(cat /sys/class/power_supply/ACAD/online 2>/dev/null)" = "1" ] && brightnessctl set 100% || brightnessctl -r; fi'
}

# 2. Sau 5 phút (300s): Tắt màn hình khi dùng pin (tiết kiệm điện tức thì; khi cắm sạc bỏ qua)
listener {
    timeout = 300
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ACAD/online 2>/dev/null)" != "1" ] && hyprctl dispatch "hl.dsp.dpms({ action = '\''disable'\'' })"'
    on-resume = hyprctl dispatch "hl.dsp.dpms({ action = 'enable' })"
}

# 3. Sau 10 phút (600s): Tự động khóa màn hình (CHỈ KHI DÙNG PIN)
listener {
    timeout = 600
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ACAD/online 2>/dev/null)" != "1" ] && loginctl lock-session'
}

# 4. Sau 15 phút (900s): Tự động ngủ (CHỈ KHI DÙNG PIN; khi cắm sạc KHÔNG bao giờ tự suspend)
listener {
    timeout = 900
    on-timeout = sh -c '[ "$(cat /sys/class/power_supply/ACAD/online 2>/dev/null)" != "1" ] && systemctl suspend'
}
