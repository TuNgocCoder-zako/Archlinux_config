[Settings]
folder = ~/Pictures/Wallpapers
wallpaper = ~/Pictures/Wallpapers/emilia_dark.png
backend = swww
monitors = All
fill = fill
sort = name
color = #ffffff
subfolders = False
show_hidden = False
show_gifs_only = False
post_command = ~/.local/bin/set-wallpaper $wallpaper
number_of_columns = 3
swww_transition_type = any
swww_transition_step = 90
swww_transition_angle = 30
swww_transition_duration = 1.5
swww_transition_fps = 60
use_xdg_state = False
