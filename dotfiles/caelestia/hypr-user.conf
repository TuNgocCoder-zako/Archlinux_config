# ╔══════════════════════════════════════════════════╗
# ║  Caelestia Shell — Enhanced Hyprland Rules       ║
# ╚══════════════════════════════════════════════════╝

# ── 1. Extra Keybindings ──
bind = SUPER, Return, exec, foot
bind = ALT, Return, exec, foot
bind = SUPER, D, exec, fuzzel
bind = ALT, D, exec, fuzzel
bind = ALT, S, exec, grim -g "$(slurp -d)" - | wl-copy && notify-send "📸 Screenshot" "Đã copy vào clipboard"
bind = SUPER SHIFT, S, exec, grim -g "$(slurp -d)" - | swappy -f -
bind = SUPER, i, exec, foot --app-id=floating-term --hold -e fastfetch
bind = ALT, i, exec, foot --app-id=floating-term --hold -e fastfetch
bind = SUPER, c, exec, foot --app-id=cava-term -e cava
bind = ALT, c, exec, foot --app-id=cava-term -e cava
bind = SUPER, v, exec, cliphist list | fuzzel -d | cliphist decode | wl-copy
bind = ALT, v, exec, cliphist list | fuzzel -d | cliphist decode | wl-copy
bind = SUPER SHIFT, W, exec, waypaper
bind = ALT, W, exec, waypaper

# ── 2. Autostart Services ──
exec-once = swww-daemon
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.local/bin/restore-wallpaper

# ── 3. Smooth Fluid Animations (Anime Bezier) ──
animations {
    enabled = true
    bezier = fluent_decel, 0.1, 1, 0, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = bounce, 0.1, 1.15, 0.1, 1.05

    animation = windows, 1, 3.5, bounce, popin 80%
    animation = windowsOut, 1, 2.5, easeOutCirc, popin 85%
    animation = windowsMove, 1, 3, fluent_decel
    animation = fade, 1, 2.5, easeOutExpo
    animation = workspaces, 1, 3.5, fluent_decel, slide
    animation = specialWorkspace, 1, 3, fluent_decel, slidevert
}

# ── 4. Smart Window Rules ──
windowrule = float, ^(pavucontrol)$
windowrule = size 680 460, ^(pavucontrol)$
windowrule = center, ^(pavucontrol)$

windowrule = float, ^(blueman-manager)$
windowrule = size 600 400, ^(blueman-manager)$
windowrule = center, ^(blueman-manager)$

windowrule = float, ^(nm-connection-editor)$
windowrule = float, ^(viewnior|Viewnior)$
windowrule = center, ^(viewnior|Viewnior)$

windowrule = float, ^(waypaper)$
windowrule = size 860 560, ^(waypaper)$
windowrule = center, ^(waypaper)$

windowrule = float, class:^(floating-term)$
windowrule = size 800 500, class:^(floating-term)$
windowrule = center, class:^(floating-term)$

windowrule = float, class:^(cava-term)$
windowrule = size 720 280, class:^(cava-term)$
windowrule = center, class:^(cava-term)$
windowrulev2 = opacity 0.90 0.80, class:^(cava-term)$

windowrulev2 = float, title:^(Open File|Save File|Choose Files|File Upload|Select a File)(.*)$
windowrulev2 = center, title:^(Open File|Save File|Choose Files|File Upload|Select a File)(.*)$

windowrulev2 = opacity 0.95 0.88, class:^(foot)$
windowrulev2 = opacity 0.95 0.88, class:^(thunar)$

# ── 5. Media & Hardware Keys ──
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

debug {
    suppress_errors = true
}
