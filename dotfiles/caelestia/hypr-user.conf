# ╔══════════════════════════════════════════════════╗
# ║  Caelestia Shell — User Hyprland Overrides        ║
# ║  This file is sourced AFTER Caelestia's configs   ║
# ╚══════════════════════════════════════════════════╝

# ── Additional keybinds ──
bind = SUPER, Return, exec, foot
bind = ALT, Return, exec, foot
bind = SUPER, D, exec, fuzzel
bind = ALT, D, exec, fuzzel
bind = ALT, S, exec, grim -g "$(slurp -d)" - | wl-copy && notify-send "Screenshot" "Copied to clipboard"

# ── Animations (Smooth & Fluid) ──
animations {
    enabled = true
    bezier = fluent_decel, 0.1, 1, 0, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1

    animation = windows, 1, 3, fluent_decel, popin 70%
    animation = windowsOut, 1, 2.5, easeOutCirc, popin 80%
    animation = fade, 1, 2.5, easeOutExpo
    animation = workspaces, 1, 3.5, fluent_decel, slide
}

# ── Media Keys ──
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# ── Suppress errors ──
debug {
    suppress_errors = true
}
