# Caelestia Shell — Enhanced Hyprland Rules

# Keybindings
bind = SUPER, Return, exec, kitty
bind = ALT, Return, exec, kitty
bind = ALT, D, exec, fuzzel
bind = ALT, S, exec, grim -g "$(slurp -d)" - | wl-copy && notify-send "📸 Screenshot" "Đã copy vào clipboard"
bind = SUPER SHIFT, S, exec, grim -g "$(slurp -d)" - | swappy -f -
bind = SUPER, i, exec, kitty --class floating-term --hold fastfetch
bind = ALT, i, exec, kitty --class floating-term --hold fastfetch
bind = SUPER, c, exec, kitty --class cava-term cava
bind = ALT, c, exec, kitty --class cava-term cava
bind = SUPER, v, exec, cliphist list | fuzzel -d | cliphist decode | wl-copy
bind = ALT, v, exec, cliphist list | fuzzel -d | cliphist decode | wl-copy
bind = SUPER SHIFT, W, global, caelestia:wallpaper
bind = ALT, W, global, caelestia:wallpaper
bind = SUPER CTRL, W, exec, caelestia wallpaper -r
bind = SUPER, L, exec, loginctl lock-session
# AI Mode (chuyển sang SUPER + A theo yêu cầu)
bind = SUPER, A, exec, ~/.local/bin/alexa-trigger
bind = SUPER SHIFT, A, exec, ~/.local/bin/alexa-stop
bind = ALT, A, exec, caelestia shell drawers toggleTab sidebar ai
bind = SUPER, B, exec, blueman-manager
bind = ALT, B, exec, blueman-manager

# Cửa sổ nổi / Floating window toggle: đã được quản lý trực tiếp bằng Lua native trong variables.lua
# (SUPER + Space và ALT + Space)


# Autostart
exec-once = uwsm finalize 2>/dev/null || true
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XMODIFIERS GTK_IM_MODULE QT_IM_MODULE
# Caelestia Shell được khởi động độc lập trên Intel Iris Xe tại ~/.config/hypr/hyprland/execs.lua (caelestia-intel)
exec-once = hypridle
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = ~/.local/bin/restore-wallpaper
exec-once = fcitx5 -d
# Bluetooth nguồn được quản lý tự động theo sạc AC (bluetooth-ac-power / asus-fan-daemon)
exec-once = blueman-applet


# Animations — Được quản lý bởi ~/.config/hypr/hyprland/animations.lua
# (Đã tối ưu cho 144Hz, không khai báo lại ở đây để tránh xung đột)

# Window Rules (Kích thước cửa sổ mở rộng rãi, to đẹp hơn trên màn 1080p)
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = size 850 540, class:^(pavucontrol)$
windowrulev2 = center, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = size 800 520, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = size 750 560, class:^(nm-connection-editor)$
windowrulev2 = center, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(viewnior|Viewnior)$
windowrulev2 = size 1100 700, class:^(viewnior|Viewnior)$
windowrulev2 = center, class:^(viewnior|Viewnior)$
windowrulev2 = float, class:^(floating-term)$
windowrulev2 = size 1050 640, class:^(floating-term)$
windowrulev2 = center, class:^(floating-term)$
windowrulev2 = float, class:^(cava-term)$
windowrulev2 = size 900 320, class:^(cava-term)$
windowrulev2 = center, class:^(cava-term)$
windowrulev2 = opacity 0.90 0.80, class:^(cava-term)$
windowrulev2 = float, title:^(Open File|Save File|Choose Files|File Upload|Select a File)(.*)$
windowrulev2 = size 950 620, title:^(Open File|Save File|Choose Files|File Upload|Select a File)(.*)$
windowrulev2 = center, title:^(Open File|Save File|Choose Files|File Upload|Select a File)(.*)$
windowrulev2 = opacity 0.95 0.88, class:^(kitty|foot)$
windowrulev2 = suppressevent fullscreen, class:^(kitty)$
windowrulev2 = opacity 0.95 0.88, class:^(thunar)$
windowrulev2 = float, class:^(com.asus.tuf.control)$
windowrulev2 = size 620 780, class:^(com.asus.tuf.control)$
windowrulev2 = center, class:^(com.asus.tuf.control)$

# Media & Hardware Keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl  = , XF86AudioPlay, exec, playerctl play-pause
bindl  = , XF86AudioNext, exec, playerctl next
bindl  = , XF86AudioPrev, exec, playerctl previous
bindel = , XF86MonBrightnessUp, exec, brightnessctl s +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl s 5%-

# ASUS TUF Keyboard — Function Keys F1-F12 (Khớp 100% biểu tượng trên bàn phím)
# F1 - F4: Âm thanh & Mic
bind = SUPER, F1, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind = SUPER, F2, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%-
bind = SUPER, F3, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bind = SUPER, F4, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# F5 (Cánh quạt ASUS Fan): Quạt tản nhiệt & Chế độ hiệu năng
bind = , XF86Launch4, exec, ~/.local/bin/asus-fan-toggle
bind = SUPER, F5, exec, ~/.local/bin/asus-fan-toggle
bind = ALT, F5, exec, ~/.local/bin/asus-fan-toggle
bind = SUPER, 5, exec, ~/.local/bin/asus-fan-toggle
bind = ALT, 5, exec, ~/.local/bin/asus-fan-toggle

# F6 (Kéo cắt Snipping Tool): Chụp ảnh màn hình
bind = , XF86Launch1, exec, grim -g "$(slurp -d)" - | swappy -f -
bind = , XF86SelectiveScreenshot, exec, grim -g "$(slurp -d)" - | swappy -f -
bind = SUPER, F6, exec, grim -g "$(slurp -d)" - | swappy -f -
bind = ALT, F6, exec, grim -g "$(slurp -d)" - | swappy -f -

# F7 & F8: Độ sáng màn hình (Mặt trời nhỏ / Mặt trời lớn)
bind = SUPER, F7, exec, brightnessctl s 5%-
bind = ALT, F7, exec, brightnessctl s 5%-
bind = SUPER, F8, exec, brightnessctl s 5%+
bind = ALT, F8, exec, brightnessctl s 5%+

# F9: Màn hình chiếu / Xuất màn hình ngoài (Project)
bind = , XF86Display, exec, ~/.local/bin/display-toggle
bind = SUPER, F9, exec, ~/.local/bin/display-toggle
bind = ALT, F9, exec, ~/.local/bin/display-toggle

# F10: Khóa / Mở Touchpad (Biểu tượng Touchpad có gạch chéo)
bind = , XF86TouchpadToggle, exec, ~/.local/bin/touchpad-toggle
bind = SUPER, F10, exec, ~/.local/bin/touchpad-toggle
bind = ALT, F10, exec, ~/.local/bin/touchpad-toggle

# F11: Chế độ ngủ (Biểu tượng Trăng khuyết Zzz)
bind = , XF86Sleep, exec, systemctl suspend
bind = SUPER, F11, exec, systemctl suspend
bind = ALT, F11, exec, systemctl suspend

# F12: Chế độ máy bay (Biểu tượng Máy bay)
bind = , XF86RFKill, exec, ~/.local/bin/airplane-mode-toggle
bind = SUPER, F12, exec, ~/.local/bin/airplane-mode-toggle
bind = ALT, F12, exec, ~/.local/bin/airplane-mode-toggle

# Phím mũi tên (Arrow keys): Đèn bàn phím & Aura RGB
bind = , XF86KbdBrightnessUp, exec, ~/.local/bin/asus-kbd-toggle up
bind = , XF86KbdBrightnessDown, exec, ~/.local/bin/asus-kbd-toggle down
bind = SUPER ALT, Up, exec, ~/.local/bin/asus-kbd-toggle up
bind = SUPER ALT, Down, exec, ~/.local/bin/asus-kbd-toggle down
bind = , XF86Launch3, exec, ~/.local/bin/asus-kbd-toggle mode
bind = , XF86Launch2, exec, ~/.local/bin/asus-kbd-toggle mode
bind = SUPER ALT, Left, exec, ~/.local/bin/asus-kbd-toggle mode
bind = SUPER ALT, Right, exec, ~/.local/bin/asus-kbd-toggle mode

