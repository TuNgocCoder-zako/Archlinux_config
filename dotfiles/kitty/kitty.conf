# Kitty Terminal Configuration
# Integrated with Caelestia Dynamic Theming

# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window styling & padding
window_padding_width    16
background_opacity      0.92
hide_window_decorations yes
confirm_os_window_close 0
remember_window_size    no
initial_window_width    960
initial_window_height   600

# Scrollback
scrollback_lines 10000

# Cursor & Smooth Animation
cursor_shape                 beam
cursor_blink_interval        0.5
cursor_stop_blinking_after   15.0
cursor_trail                 1
cursor_trail_decay           0.1 0.35
cursor_trail_start_threshold 2
detect_urls                  yes

# Tab bar
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted

# Performance & Rendering (Tuned for 144Hz ultra-fluidity)
repaint_delay    6
input_delay      2
sync_to_monitor  yes
scrollback_fill_enlarged_window yes

# Caelestia Dynamic Theme (Auto-generated from wallpaper)
include ~/.local/state/caelestia/theme/kitty.conf

# Clipboard / Copy & Paste
map ctrl+c copy_and_clear_or_interrupt
map ctrl+shift+v paste_from_clipboard
# Không chặn Ctrl+V ở tầng Kitty để CLI (agy, vim) nhận diện được phím paste ảnh/tệp tin trực tiếp

# Chặn phím phóng to toàn màn hình của Kitty (tránh làm mất bố cục phân chia màn hình của Hyprland)
map f11 no_op
map ctrl+shift+f11 no_op
