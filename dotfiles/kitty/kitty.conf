# Kitty Terminal Configuration
# Integrated with Caelestia Dynamic Theming

# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Window styling & padding
window_padding_width    16
background_opacity      0.92
hide_window_decorations yes
confirm_os_window_close 0

# Window Logo (Meme)
window_logo_path        /home/tu/Pictures/Meme/4a5e3a42207397e1e66a471f75b9045d.jpg
window_logo_position    top-right
window_logo_alpha       0.85
window_logo_scale       30

# Scrollback
scrollback_lines 10000

# Cursor
cursor_shape          beam
cursor_blink_interval 0.5
detect_urls           yes

# Tab bar
tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted

# Performance & Rendering (Tuned for 144Hz)
repaint_delay    6
input_delay      2
sync_to_monitor  yes

# Caelestia Dynamic Theme (Auto-generated from wallpaper)
include ~/.local/state/caelestia/theme/kitty.conf
