# ╔══════════════════════════════════════╗
# ║    Starship — Anime Prompt          ║
# ╚══════════════════════════════════════╝

# Prompt format
format = """
[╭─](bold #cba6f7) $os$username$hostname$directory$git_branch$git_status$cmd_duration$fill$time
[╰─](bold #f5c2e7)$character"""

# Scan timeout
scan_timeout = 10
command_timeout = 500
add_newline = true

[fill]
symbol = " "

[os]
disabled = false
format = "[$symbol ]($style)"
style = "bold #f5c2e7"

[os.symbols]
Arch = "󰣇"
Linux = ""

[username]
show_always = false
format = "[$user]($style) "
style_user = "bold #89b4fa"
style_root = "bold #f38ba8"

[hostname]
ssh_only = true
format = "@ [$hostname]($style) "
style = "bold #94e2d5"

[directory]
format = "[ $path]($style)[$read_only]($read_only_style) "
style = "bold #b4befe"
read_only = " 🔒"
read_only_style = "#f38ba8"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
format = "[ $branch]($style) "
style = "bold #cba6f7"
truncation_length = 24

[git_status]
format = '([$all_status$ahead_behind]($style) )'
style = "bold #f38ba8"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇡$ahead_count⇣$behind_count"
modified = "!$count"
staged = "+$count"
untracked = "?$count"
deleted = "✘$count"

[cmd_duration]
format = "[⏱ $duration]($style) "
style = "bold #f9e2af"
min_time = 2_000
show_milliseconds = false

[time]
disabled = false
format = "[ $time]($style)"
style = "bold #6c7086"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold #f5c2e7)"
error_symbol = "[❯](bold #f38ba8)"
vimcmd_symbol = "[❮](bold #a6e3a1)"

[package]
disabled = true

[python]
format = "[ $version]($style) "
style = "#f9e2af"

[rust]
format = "[ $version]($style) "
style = "#fab387"

[nodejs]
format = "[ $version]($style) "
style = "#a6e3a1"

[c]
format = "[ $version]($style) "
style = "#89b4fa"
